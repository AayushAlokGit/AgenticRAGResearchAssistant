# Naive-baseline configuration.
#
# Every value here is a STARTING GUESS, not a tuned setting. They are knobs to be
# moved and measured against the eval set (see DESIGN_DECISIONS.md DD-001). This file
# is versioned so eval runs are reproducible and single changes can be A/B tested.

llm:
  # Gemini-only for now (the only provider key currently available) — see DD-003.
  # Still kept router-shaped: provider_order is a list so adding tiers later is a
  # one-line change, no code rewrite.
  provider_order: [gemini] # later, when more keys exist: [anthropic, gemini, ollama]
  models:
    gemini: gemini-2.5-flash # agent loop / judge
    anthropic: claude-sonnet-4-6 # reference only; unused until an Anthropic key exists
    ollama: llama3.1 # reference only; unused until Ollama is set up
  temperature: 0.0 # near-deterministic for reproducible evals
  max_tokens: 1024

embedding:
  # Local + free + offline; needs NO API key, so it preserves the limited Gemini quota
  # for agent reasoning during repeated re-indexing (DD-003). To go full-Gemini instead,
  # swap to the gemini line below (and confirm the exact model id against your access).
  model: sentence-transformers/all-MiniLM-L6-v2 # local, CPU-friendly baseline
  # model: gemini-embedding-001  # Gemini embeddings (consumes API quota)

retrieval:
  chunk_size: 800 # characters; naive fixed-size chunking to start
  chunk_overlap: 100
  top_k: 5 # chunks returned per query

corpus:
  root: ./corpus # seed corpus until the user's own docs exist

eval:
  dataset: ./evals/datasets/seed.yaml
