# Versioned eval config — knobs to A/B against the eval set. Rationale + A/B
# numbers live in DESIGN_DECISIONS.md / docs/EXPERIMENTS.md (DD refs below).

llm:
  # Fallback order for a role with no explicit provider; first = default (DD-004, DD-021).
  provider_order: [gemini, groq] # later, also: anthropic, ollama
  models:
    gemini: gemini-2.5-flash # default model per provider
    groq: llama-3.3-70b-versatile
  roles:
    controller: {provider: gemini, model: gemini-2.5-flash}
    generator: {provider: gemini, model: gemini-2.5-flash}
    judge: {provider: gemini, model: gemini-2.5-flash}
    # judge: {provider: groq, model: meta-llama/llama-4-scout-17b-16e-instruct} # different family from the gemini generator (DD-013 self-grade avoidance); paired with the redesigned grading prompt
  temperature: 0.0 # near-deterministic for reproducible evals
  max_tokens: 2048 # was 1024 — too small: truncated long "complete account" answers mid-thought
                   # (a06 hit the cap at ~1024 tokens and dropped its 4th part; also broke batched tagging)
  max_retries: 5 # provider-level backoff before the router falls through to the next tier
  timeout: 30.0 # seconds per request

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2 # CPU-friendly baseline; stronger embedder lost its A/B (DD-026)

retrieval:
  top_k: 5 # chunks per query — 5 is the champion, 8 lost to distractors (DD-017)
  mode: hybrid # dense | hybrid — hybrid won (DD-009)
  hybrid:
    # dense (vector) + BM25 (keyword), fused by Reciprocal Rank Fusion.
    rrf_k: 60 # RRF damping constant (standard default)
    candidate_k: 20 # chunks pulled from EACH retriever before fusing down to top_k
  multi_query:
    # RAG-Fusion (DD-034): expand each query into facet-diverse, doc-style variants
    # (prompts/query_reformulate.md), retrieve each via the base, RRF-fuse the pool, then
    # rerank. Targets the retrieval-cluster failures where the missed doc IS retrievable for a
    # well-aimed query but not the controller's phrasing (and enumeration Qs that no single
    # query can cover). Costs one reformulation LLM call per UNIQUE query (cached per run).
    enabled: false # A/B vs the B1 baseline; off until it earns its place
    n_queries: 4 # variants to GENERATE per query (the original is added on top, then deduped)
  rerank:
    # Stage 2: cross-encoder re-scores (query, chunk) pairs for precision (DD-014).
    enabled: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2 # local cross-encoder; a heavier bge-reranker-large was A/B'd and lost
    candidate_k: 20 # chunks handed from stage 1, re-scored down to top_k
  parent_expansion:
    # Stage 3 small-to-big: expand each top_k chunk into its ±window same-source
    # neighbours to restore split tables/sections without distractors (DD-020).
    enabled: true
    window: 1 # window=1 => 3-chunk parent windows

agent:
  # When on, the answer path is a retrieve->reason->retrieve loop (Module 2).
  # ON by default — won its matched A/B (DD-022). Flip to false for the naive baseline.
  enabled: true
  max_rounds: 5 # hard budget: max search rounds before a forced answer (circuit breaker)
  # Tool catalogue: agent/tools.py. Enabled set below is the controller's action space —
  # every tool here taxes routing on EVERY question (bigger system prompt = noisier tool choice).
  # DD-031 LANDED: both expand_* tools DROPPED from the action space (B1, lean menu). Measured on
  # the v2 set (n=3): adding `expand_around_chunk` robustly REGRESSED 5 v1-solid Qs (a02/a05/a10/a12/a17)
  # while never firing reliably on its own meter (a18) and never fixing its target (a16, 0/3) — net
  # NEGATIVE. `expand_document` fired ZERO times on all 3 of its breadth meters (a05/a06/a12) across
  # all runs — provably dead weight (search already carries breadth). Both kept in the catalogue,
  # config-gated OFF (cf. parent_expansion), re-enable behind a properly-prompted A/B if ever needed.
  tools: [search, list_sources, finish]
  # Final-answer evidence char cap (arrival-order trim). 0 = OFF (keep all gathered evidence).
  # NEW AGENTIC BASELINE: starts OFF. The trim originated as a Groq-6K-wall survival hack;
  # under the PRIOR pure-RAG + simple-ReAct pipeline an A/B found it incidentally helped as a
  # quality filter (DD-023: 0 lost .800->.725 by diluting answers). That result belongs to the
  # old lineage — this agentic system (multi-tool; expand_document can dump a whole doc) has
  # different evidence-volume dynamics, so the trim must re-earn its place. Re-run the A/B
  # (0 vs 16000) on this pipeline before re-enabling.
  answer_char_budget: 0

corpus:
  root: ./corpus # seed corpus until the user's own docs exist

vector_store:
  # Persistent ChromaDB (cosine HNSW); we pass local embeddings in so the embedder
  # stays swappable (DD-006).
  provider: chromadb
  path: ./chromadb_data # persistent dir (gitignored)
  collection: corpus

ingestion:
  # sha256-of-bytes idempotency tracker (not mtime/size), so a git checkout doesn't
  # force re-embedding (DD-006).
  tracking_file: ./chromadb_data/processed_files.json
  # Chunking is ingestion-time only (the retriever never sees these knobs).
  chunk_size: 800 # characters
  chunk_overlap: 100
  chunking:
    strategy: fixed # fixed | recursive — recursive lost the A/B at this chunk_size (DD-017)

prompts:
  dir: ./prompts # versioned prompt files, loaded by name, so a prompt change is A/B testable

eval:
  dataset: ./evals/datasets/seed.yaml
