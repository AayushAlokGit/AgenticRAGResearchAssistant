# Memory eval — SESSION 5: knowledge consolidation / cross-session synthesis recall (capability E, slice 2)
#
# WHAT THIS TESTS (docs/memory/MEMORY_CAPABILITIES.md, capability E). The accumulation session
# (DD-049) showed slice-1 episodic recall CANNOT reuse a prior FACT across a reasoning chain: a
# question that *uses* a fact isn't similar to the *question* that produced it. An offline crux
# check (3 read strategies x 5 pairs) confirmed NO single-vector read bridges a chain — the link
# is compositional/anaphoric, not topical. CONCLUSION: serve cross-session reuse by CONSOLIDATION
# (at session end, distil related episodes into a synthesis record, APPENDED to the store) and
# recall it via the SAME question->question mechanism slice 1 already proved (DD-046).
#
# WHY APPEND, NOT REPLACE (measured): replacing facet episodes with a broad synthesis REGRESSES
# narrow-paraphrase recall — a narrow facet question buried in a long synthesis loses its terms
# (offline: a pooling-facet narrow query fell 0.945 -> 0.244 against the synthesis). Appending
# keeps both, and the existing top-k recall routes each query for free: narrow -> its facet,
# broad -> the synthesis. Consolidation is a COVERAGE op; shrinking the store is FORGET's job
# (separate, deferred). Store: ONE store, records discriminated by a `kind` field (episode|synthesis);
# consolidate reads only raw episodes (never re-merges its own output).
#
# THE SHAPE (cross-session, N:1). SESSION 1 seeds several DISTINCT facets of TWO subjects plus a
# lone singleton. The store CONSOLIDATES (subject A's facets -> one synthesis; subject B's -> another;
# singleton untouched), then the process RESTARTS (reload from disk, as in persistence). SESSION 2
# probes every way consolidation can help, fail to help, regress, or over-reach.
#
# SCENARIO COVERAGE (critically chosen — the distinct NEW failure modes consolidation introduces,
# each FIRE case paired with a QUIET case per the classifier discipline):
#   S1 WIN              broad synthesis recall, cheap + complete ............ c07 (subj A), c08 (subj B)
#   S2 NO-REGRESSION    narrow paraphrase of a MERGED facet still recalls ... c09 (the worst-case pooling facet)
#   S3 NO-REGRESSION    paraphrase of a SINGLETON (un-merged) still recalls . c10
#   S4 PRECISION        broad distractor (parallel subject) must NOT recall . c11 (Azure path; soft ~0.47 collision)
#   S5 PRECISION        narrow distractor (near a facet, diff answer) ....... c12 (Azure model/dim; sharp ~0.75 vs c01)
#   S6 MERGE CORRECTNESS over-merge guard: A and B kept SEPARATE ........... c08 (broad-B must return B only, no A facts)
#   (no-harm)           unrelated novel must stay quiet ..................... c13
# DEFERRED: S8 conflict-surfacing (would need fabricated contradictory facts; overlaps the agentic
# a24 synthesis gap) — headroom, not tested here. S9 no-merge / S10 empty / S11 re-consolidation
# idempotency are CODE behaviors (unit tests / runner asserts), not sequenced-question cases.
#
# *** RUNNER CONTRACT this dataset implies ***  At the session-1->2 boundary the runner must
# CONSOLIDATE (merge related episodes) BEFORE the simulated restart, then reload from disk. The
# informative comparison is THREE conditions: OFF (no memory) / ON-EPISODIC (raw episodes, no merge)
# / ON-CONSOLIDATED (merged). OFF->consolidated shows the gain; episodic->consolidated isolates what
# the MERGE adds over plain recall (esp. on the broad c07/c08, where episodic recalls only ONE facet).
# Under slice 1 (no consolidation yet) the broad probes are HEADROOM; the narrow/singleton/precision
# probes must already hold (they are the regression guards consolidation must not break).
#
# Extra fields: role, relates_to (the seeds a probe spans / pairs with), expect_recall, session.

version: 1
corpus: ./corpus

questions:
  # ═══ SESSION 1 — seed two mergeable subjects + one singleton; each writes its own episode ══════
  # ── Subject A: the ChromaDB-variant query path (3 facets -> should consolidate into one synthesis)
  - id: c01
    session: 1
    role: seed
    expect_recall: false
    type: factual
    question: "In the ChromaDB / local-embeddings variant of the documentation-retrieval MCP server, which embedding model is used and what is its output vector dimensionality?"
    match: all
    expected_sources:
      - 02-Architecture-with-chromadb-local-embeddings.md
    should_abstain: false
    expected_answer: "It uses the local Sentence-Transformers all-MiniLM-L6-v2 model, which produces 384-dimensional vectors."
    notes: "Subject A, facet 1 (model + dimensionality)."

  - id: c02
    session: 1
    role: seed
    expect_recall: false
    type: factual
    question: "When that local embedding service turns a piece of text into its vector, what pooling and normalization does it apply to produce the final vector?"
    match: all
    expected_sources:
      - LOCAL_EMBEDDING_SERVICE_DOCUMENTATION.md
    should_abstain: false
    expected_answer: "It runs the model forward pass, then applies MEAN POOLING over the token embeddings and finally L2 NORMALIZATION to produce a unit-length vector."
    notes: "Subject A, facet 2 (pooling + L2 normalization). This is the WORST-CASE facet for narrow recall after merge (see c09)."

  - id: c03
    session: 1
    role: seed
    expect_recall: false
    type: factual
    question: "Once a unit-length vector is stored in the ChromaDB variant, what index type and similarity function are used to find the nearest matches?"
    match: all
    expected_sources:
      - 02-Architecture-with-chromadb-local-embeddings.md
      - VECTOR_DB_INTERNALS.md
    should_abstain: false
    expected_answer: "ChromaDB indexes the vectors with an HNSW index and ranks nearest neighbours by COSINE similarity (which, on unit-length vectors, is equivalent to the dot product)."
    notes: "Subject A, facet 3 (index + similarity). c01+c02+c03 = the full query path, spread across three episodes."

  # ── Subject B: the claims-extraction pipeline (2 facets -> should consolidate into a SEPARATE synthesis)
  - id: c04
    session: 1
    role: seed
    expect_recall: false
    type: factual
    question: "In the claims-extraction pipeline, what is the role of the normalizer stage?"
    match: any
    expected_sources:
      - normalizer.md
    should_abstain: false
    expected_answer: "The normalizer cleans and standardizes the raw claim text into a consistent canonical form (e.g. normalizing whitespace, casing, dates and formatting) before the extractor runs, so downstream extraction sees uniform input."
    notes: "Subject B, facet 1. A DIFFERENT subject from A — consolidation must NOT fuse A and B."

  - id: c05
    session: 1
    role: seed
    expect_recall: false
    type: factual
    question: "In the claims-extraction pipeline, what is the role of the extractor stage and how does it decide between rules and the LLM?"
    match: any
    expected_sources:
      - extractor.md
      - DESIGN.md
    should_abstain: false
    expected_answer: "The extractor pulls structured fields/facts out of the normalized claim text. It uses deterministic rules for exact, templated data where reproducibility is non-negotiable (e.g. reserve dollar amounts) and the LLM only where a fact needs reading comprehension."
    notes: "Subject B, facet 2. With c04 this is the pipeline story; the pair should merge into a B-synthesis."

  # ── A lone singleton: a different subject with NO peer (consolidation must leave it untouched)
  - id: c06
    session: 1
    role: seed
    expect_recall: false
    type: factual
    question: "What does a reranker (cross-encoder) do in the retrieval pipeline, and why is it applied after the initial vector search rather than instead of it?"
    match: any
    expected_sources:
      - RERANKING.md
    should_abstain: false
    expected_answer: "A reranker re-scores the initial candidate set with a cross-encoder that reads the query and a document jointly, giving more accurate relevance ordering than the first-stage bi-encoder vector search. It runs after retrieval because joint scoring is too expensive to apply across the whole corpus, so it refines only the top candidates."
    notes: "SINGLETON: no peer to merge with -> consolidate must leave it as a raw episode (tested by c10)."

  # ── ⟦ CONSOLIDATE (A-facets -> synthesis; B-facets -> synthesis; singleton untouched) then RESTART ⟧

  # ═══ SESSION 2 — probe every scenario (see header map) ════════════════════════════════════════
  - id: c07
    session: 2
    role: repeat
    relates_to: [c01, c02, c03]
    expect_recall: true
    type: multi_hop
    question: "Walk through the complete query path for the ChromaDB variant, from raw query text to the ranked nearest-neighbour results — name the model, the vector dimensionality, the pooling and normalization, the index, and the similarity function."
    match: all
    expected_sources:
      - 02-Architecture-with-chromadb-local-embeddings.md
      - LOCAL_EMBEDDING_SERVICE_DOCUMENTATION.md
      - VECTOR_DB_INTERNALS.md
    should_abstain: false
    expected_answer: "Raw query text -> all-MiniLM-L6-v2 forward pass -> mean pooling over token embeddings -> L2 normalization to a unit-length 384-dimensional vector -> stored/queried in ChromaDB via an HNSW index -> nearest neighbours ranked by cosine similarity (the dot product on unit vectors)."
    notes: "S1 WIN (subject A): broad N:1 synthesis spanning c01+c02+c03. A flat episodic store recalls only ONE facet; the consolidated synthesis answers it whole + cheaply. THE headline."

  - id: c08
    session: 2
    role: repeat
    relates_to: [c04, c05]
    expect_recall: true
    type: multi_hop
    question: "Summarize how the claims-extraction pipeline processes a raw claim through its stages — what the normalizer does first and what the extractor does next."
    match: any
    expected_sources:
      - normalizer.md
      - extractor.md
    should_abstain: false
    expected_answer: "First the normalizer cleans and standardizes the raw claim text into a consistent canonical form; then the extractor pulls structured fields out of that normalized text, using deterministic rules for exact templated data (e.g. reserve amounts) and the LLM only for facts needing reading comprehension."
    notes: "S1 WIN (subject B) AND S6 OVER-MERGE GUARD: must recall the B-synthesis (claims pipeline), NOT subject A's vector facts. If the answer mentions embeddings/HNSW/cosine, consolidation wrongly fused A and B."

  - id: c09
    session: 2
    role: repeat
    relates_to: c02
    expect_recall: true
    type: factual
    question: "What pooling and normalization does the local embedding service apply when it builds a text vector?"
    match: all
    expected_sources:
      - LOCAL_EMBEDDING_SERVICE_DOCUMENTATION.md
    should_abstain: false
    expected_answer: "It runs the model forward pass, then applies MEAN POOLING over the token embeddings and finally L2 NORMALIZATION to produce a unit-length vector."
    notes: "S2 NO-REGRESSION (worst case): a narrow paraphrase of the c02 facet that COLLAPSED 0.945->0.244 against the synthesis offline. With APPEND it must route to its own facet and still recall. The whole reason we chose append over replace."

  - id: c10
    session: 2
    role: repeat
    relates_to: c06
    expect_recall: true
    type: factual
    question: "Why is a cross-encoder reranking step run after first-stage retrieval instead of applied across the whole corpus?"
    match: any
    expected_sources:
      - RERANKING.md
    should_abstain: false
    expected_answer: "Because the cross-encoder scores a query and document jointly, which is far more accurate but too expensive to run over every document; running it only on the top candidates from first-stage retrieval gets the better ordering at affordable cost."
    notes: "S3 NO-REGRESSION (singleton): a paraphrase of c06, which had no peer to merge. Must still recall its untouched raw episode (proves consolidate left non-grouped episodes alone)."

  - id: c11
    session: 2
    role: distractor
    relates_to: [c01, c02, c03]
    expect_recall: false
    type: multi_hop
    question: "Walk through the complete query path for the Azure Cognitive Search variant, from raw query text to the ranked nearest-neighbour results — name the search backend, the embedding model, and the vector dimensionality."
    match: all
    expected_sources:
      - 01-Architecture-with-azure-cognitive-search.md
    should_abstain: false
    expected_answer: "The Azure variant uses Azure Cognitive Search as the vector store and Azure OpenAI text-embedding-ada-002 (1536-dimensional) embeddings; a raw query is embedded with ada-002 and the nearest neighbours are retrieved from the Azure Cognitive Search index."
    notes: "S4 PRECISION (broad distractor): structurally mirrors c07 but is the PARALLEL subject. Soft collision (~0.47 vs c07 — the embedder separates the two architectures at path granularity); the A-synthesis is handed as a hint by threshold-free recall and must be REJECTED. Answer is Azure/ada-002."

  - id: c12
    session: 2
    role: distractor
    relates_to: c01
    expect_recall: false
    type: factual
    question: "In the Azure Cognitive Search variant of the documentation-retrieval MCP server, which embedding model is used and what is its output vector dimensionality?"
    match: all
    expected_sources:
      - 01-Architecture-with-azure-cognitive-search.md
    should_abstain: false
    expected_answer: "The Azure variant uses Azure OpenAI text-embedding-ada-002, which produces 1536-dimensional vectors."
    notes: "S5 PRECISION (sharp narrow distractor): a near-duplicate of c01 (one token: Azure vs ChromaDB), DIFFERENT answer. High collision (~0.75) -> the c01 episode is recalled at high similarity and must NOT be reused. The classic precision test, now in the consolidation store."

  - id: c13
    session: 2
    role: novel
    expect_recall: false
    type: factual
    question: "Why does the ingestion pipeline split documents into smaller overlapping chunks instead of embedding each document as a single whole?"
    match: any
    expected_sources:
      - CHUNKING.md
    should_abstain: false
    expected_answer: "Because an embedding compresses a whole text into one fixed vector, so a long document's specific facts get averaged away and retrieval becomes imprecise; splitting into smaller overlapping chunks keeps each vector focused on a local span (improving recall precision) while the overlap avoids cutting a fact across a boundary."
    notes: "NO-HARM: unrelated to A, B, or the reranking singleton. ON must not spuriously recall any synthesis or episode (= agentic a15 / persistence p07)."
