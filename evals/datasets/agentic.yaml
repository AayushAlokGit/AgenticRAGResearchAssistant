# Agentic eval set — v2
#
# The CAPABILITY layer that complements seed.yaml's REGRESSION layer, organized by AGENT
# capability. See docs/evals/AGENT_EVAL_SETS.md for the taxonomy, design rationale, and the
# corpus/distractor structure.
#
# ── Schema ────────────────────────────────────────────────────────────────────────────────
# Outcome fields (id, type, question, match, expected_sources, should_abstain, expected_answer,
# notes) + two optional agentic fields:
#   capability : single_shot_efficiency | decomposition | tool_selection | grounded_stopping |
#                adaptive_recovery. (Free-text tag — the loader does NOT constrain it; keep it
#                aligned with the taxonomy in AGENT_EVAL_SETS.md.)
#   trajectory : OPTIONAL loose L1 path assertion, scored as a SEPARATE diagnostic (PASS/FAIL),
#                never folded into correctness. Keys map onto the run Trajectory:
#                  expects_tool  : tool_calls[tool] >= 1    (binds to the CODE name — DD-027)
#                  max_rounds    : rounds_used <= N   (rounds_used COUNTS finish; cheapest = 2)
#                  min_searches  : tool_calls['search'] >= N
#                  expects_exit  : exit_reason == finish | budget | oscillation
#
# ── Capability coverage (taxonomy → questions) ────────────────────────────────────────────
#   single_shot_efficiency : a01, a02 (RAG) · a11, a15 (claims) · a17 (cross-domain homonym)
#   decomposition          : a03 (RAG) · a10, a14 (claims) · a16 (MCP-server) · a22 (BRIDGE) · a24 (conflict)
#   tool_selection         : a07, a25 (list_sources — the only selectable non-search content tool).
#                            a05, a06, a12, a18 WERE expand_document/expand_around_chunk cases; those
#                            tools were dropped from the action space (DD-031), so they now run
#                            search-only as OUTCOME-only breadth/local-synthesis probes (no trajectory).
#   grounded_stopping      : a08, a09 (RAG abstain) · a13 (claims abstain) · a20 (oscillation) · a23 (PARTIAL)
#   adaptive_recovery      : a19 (knob/stage distractor → reformulate) · a26 (score/stage distractor → reformulate)
#   (budget-exit stress)   : a21 (exercises exit_reason==budget)   [trajectory-only intent; see notes]
#
# ── Notes ─────────────────────────────────────────────────────────────────────────────────
#   - a04 is intentionally VACANT — ids are stable handles, never renumbered (seed.yaml convention).
#   - extraction-improvement-roadmap.md is DELIBERATELY not targeted (volatile open-issues log).
#   - v2 added a18–a25 to close coverage gaps (AGENT_EVAL_SETS.md A1: a capability with NO example
#     is one you fly blind on). Several are EXPECTED to fail/flag at first — that is intended
#     headroom (A6), not a regression. What v2 newly covers:
#       * a18 — expand_around_chunk had ZERO cases despite being a live default tool (config:48).
#               (That tool was SINCE dropped from the action space, DD-031 — a18 now runs search-only,
#               OUTCOME-only, with no trajectory assertion.)
#       * a19 — adaptive_recovery: first seeded case (was deferred to A3). Outcome-gradable now;
#               full tool-ERROR recovery still waits for A3, so trajectory here is a SOFT probe.
#       * a20/a21 — exit-condition coverage (oscillation / budget). These deliberately BEND A3's
#               "assert the good path": for a pathological/oversized input the invariant worth
#               asserting is WHICH circuit-breaker catches it. A truly-ideal clean finish reads
#               as a BENIGN trajectory miss here (separate diagnostic axis, never an outcome fail).
#       * a22 — dependent/BRIDGE multi-hop (hop-2 query needs hop-1's answer) vs the existing
#               PARALLEL multi-hops a03/a10/a14/a16.
#       * a23 — PARTIAL answerability (answer AWW/CR, abstain ONLY on NLE) — selective honesty.
#       * a24 — CONFLICTING evidence (the Azure vs ChromaDB architecture docs disagree).

version: 2
corpus: ./corpus            # 22-doc snapshot (RAG-server docs + claims-ETL docs)

questions:
  # ═══ single_shot_efficiency — answer in ONE search; over-searching is the failure ═══════
  - id: a01
    type: factual
    capability: single_shot_efficiency
    question: "In vector search, why are embeddings normalized to unit length before they're stored?"
    match: any
    expected_sources:
      - VECTOR_DB_INTERNALS.md
    should_abstain: false
    expected_answer: "So cosine similarity collapses to a plain dot product: once every vector has length 1, cos(a,b) = a·b. You pay the division once at embed time, making every later comparison a cheap dot product — and on unit vectors L2 distance and cosine give the same ranking, so cosine semantics can ride on L2-optimized index machinery."
    trajectory:
      max_rounds: 2
      expects_exit: finish
    notes: "Single self-contained fact (VECTOR_DB_INTERNALS §3). Tests that the agent recognizes one search suffices and stops, instead of looping. Efficiency probe."

  - id: a02
    type: factual
    capability: single_shot_efficiency
    question: "What are the forcing functions that make chunking necessary in the first place?"
    match: any
    expected_sources:
      - CHUNKING.md
    should_abstain: false
    expected_answer: "Four hard constraints: (1) the embedder's input limit (models truncate beyond ~256–512 tokens); (2) retrieval precision (a single vector for a whole document averages away specifics); (3) the generation budget (you can't stuff whole documents into the prompt); and (4) signal-to-noise (a focused chunk gives the generator the relevant passage without distractor text)."
    trajectory:
      max_rounds: 2
      expects_exit: finish
    notes: "Enumerated fact concentrated in one section (CHUNKING §1). One search lands it. Efficiency probe — a four-item list shouldn't tempt extra rounds."

  - id: a11
    type: factual
    capability: single_shot_efficiency
    question: "What are the two persisted tables in the claims data model, and what is the conceptual distinction between them?"
    match: any
    expected_sources:
      - data-modeling.md
      - DESIGN.md
    should_abstain: false
    expected_answer: "Two tables: Claim and Event. Claim holds facts that describe the claim ITSELF — mostly static over its lifetime (claim_id, jurisdiction, claim_type, date_of_loss) — answering 'what is this claim about?'. Event is the derived, queryable timeline: each row is a typed, dated thing that happened (reserve_change, appointment, return_to_work), with type-specific data in a JSON attributes column. Rule of thumb: if a fact has its own date it's an Event; if it has no meaningful date it's a Claim attribute. Two tables is the minimum schema where the four sample queries reduce to one-line aggregations."
    trajectory:
      max_rounds: 2
      expects_exit: finish
    notes: "Single concentrated fact (data-modeling.md §1, also DESIGN.md §3). One search lands it. Efficiency probe (claims domain)."

  - id: a15
    type: factual
    capability: single_shot_efficiency
    question: "In the claims extraction pipeline, why are reserve-change dollar amounts pulled out with deterministic rules and never sent through the LLM?"
    match: any
    expected_sources:
      - extractor.md
      - DESIGN.md
    should_abstain: false
    expected_answer: "Because reserve amounts are exact, templated financial data where reproducibility is non-negotiable: a rule regex captures 'Changed to $321,014.00' precisely, whereas an LLM could round it to $321,000 — a catastrophic and silent failure. This is the hybrid principle: rules where the text is templated and correctness is exact (money, dates in structured headers); the LLM only where the fact needs reading comprehension (e.g. did a return-to-work actually happen vs. is it merely being discussed). Rules' failure mode is a recoverable 'no match'; an LLM's failure mode on exact financial data is a wrong number."
    trajectory:
      max_rounds: 2
      expects_exit: finish
    notes: "Single sharp principle (extractor.md §3, DESIGN.md §5). One search lands it. Efficiency probe (claims domain) — a one-fact question shouldn't tempt extra rounds."

  - id: a17
    type: factual
    capability: single_shot_efficiency
    question: "In the claims pipeline's normalization step, what is done to garbled characters such as 'â€\"' in a note body, and why does handling them correctly matter for the extractors that run afterward?"
    match: any
    expected_sources:
      - normalizer.md
    should_abstain: false
    expected_answer: "The Normalizer applies lossless, character-level mojibake repair: 'â€\"' (a UTF-8 em dash mis-decoded as Windows-1252) is fixed back to '—', 'â€™' to a right single quote, stray 'Â ' non-breaking-space artifacts to a regular space, CRLF line endings to '\\n', and so on. It matters downstream for two reasons: (1) the RULE extractors' regexes silently fail when a templated marker reads 'Date of Appointmentâ€\"' instead of 'Date of Appointment—'; and (2) the LLM extractor's evidence_quote substring check fails when the body and the copied quote disagree on a character the model treats as a dash. Crucially this is character-ENCODING repair that preserves meaning — it is NOT the unit-length vector normalization done in the vector-search pipeline, a different operation in a different system that merely shares the word."
    trajectory:
      max_rounds: 2
      expects_exit: finish
    notes: "Cross-domain HOMONYM probe: 'normalization' here is text/encoding cleanup (normalizer.md §3.1) but in VECTOR_DB_INTERNALS §3 ('Normalization (the trick)') it is unit-vector scaling — a strong lexical distractor spanning the two domains. The qualifiers ('claims pipeline', 'garbled characters', the mojibake string, 'extractors afterward') disambiguate toward normalizer.md; the bare term pulls toward the vector doc. The OUTCOME axis is the real test: did the agent ground the RIGHT sense and not borrow the vector-normalization answer? A trajectory miss (>1 search) most likely means the first search surfaced the vector sense and the agent reformulated — a SOFT early signal of the DEFERRED adaptive_recovery capability (see Known gap), a flag to inspect, not an auto-fail."

  # ═══ decomposition — facts split across docs/stages; agent must take ≥2 hops ════════════
  - id: a03
    type: multi_hop
    capability: decomposition
    question: "Trace a chunk through this pipeline: what dial governs the SIZE it is split at (and what caps that size), how is its vector made cheap to compare by cosine at query time, and what second-stage model re-scores it for precision?"
    match: all
    expected_sources:
      - CHUNKING.md
      - VECTOR_DB_INTERNALS.md
      - RERANKING.md
    should_abstain: false
    expected_answer: "Size is set by the chunk_size dial — the master precision↔context knob — capped above by the embedder's token input limit (e.g. MiniLM ~256–512 tokens). The chunk's vector is normalized to unit length at embed time, so cosine similarity becomes a plain dot product (a cheap comparison) at query time. Then a cross-encoder reranker re-scores the (query, chunk) pair jointly in stage 2 for precision."
    trajectory:
      min_searches: 2
    notes: "Genuine 3-hop: chunk_size dial + embedder cap (CHUNKING §5/§1), normalization→dot (VECTOR_DB §3), cross-encoder rerank (RERANKING §2/§9). Each doc holds one necessary third; match:all so partial retrieval scores partial. Forces ≥2 searches."

  - id: a10
    type: multi_hop
    capability: decomposition
    question: "In the claims pipeline the Normalizer cleans text and dates, yet it deliberately leaves the dates INSIDE a note's body as raw text — why? And separately, why is collapsing the many surface forms of a provider's name ('Dr. Caldwell', 'Caldwell, MD', the clinic name) into one identity the RESOLVER's job rather than the Normalizer's?"
    match: all
    expected_sources:
      - normalizer.md
      - resolver.md
    should_abstain: false
    expected_answer: "The Normalizer parses the note's HEADER date into a typed ISO field but leaves BODY dates as raw text for two reasons: (1) the LLM extractor's evidence_quote must stay a verbatim substring of the body — a post-LLM substring check verifies it — so rewriting the body would break that check and an auditor's ability to trace the extraction; and (2) body dates are often ambiguous (5/4 could be May 4 or Apr 5; 'the 21st'; '4 weeks' is a duration), so rewriting in place risks corrupting text — a recoverable null from the shared date parser is safer. Identity canonicalization is the RESOLVER's job because it needs CROSS-NOTE context: the Normalizer is stateless per-note and can't see the other mentions, whereas the Resolver merges encounters on the parties-set key (deterministic normalization + set intersection) at the stage where that cross-note context exists."
    trajectory:
      min_searches: 2
    notes: "Genuine 2-hop across stages: body-dates-left-raw (normalizer.md §3.2/§7) + identity-is-the-Resolver's-job (normalizer.md §7 → resolver.md §1/§5). Real causal structure: evidence_quote fidelity drives the date choice; cross-note context drives the identity choice. match:all."

  - id: a14
    type: multi_hop
    capability: decomposition
    question: "A single appointment is mentioned in two separate notes — a scheduling notice and a later 'she attended' record. Which pipeline stage is STRUCTURALLY unable to merge these two mentions into one event and why, and which stage does merge them, on what matching key?"
    match: all
    expected_sources:
      - extractor.md
      - resolver.md
    should_abstain: false
    expected_answer: "The EXTRACTOR is structurally unable to merge them: it runs per note and cannot see other notes, so it emits each mention as a separate candidate (one-sided/empty is fine — duplication is expected and cheap). The RESOLVER does the merge, using the appointment match key (claim_id, exact encounter_date, parties_overlap ≥ 1): it normalizes the LLM-emitted parties set deterministically (strip honorifics/degree suffixes, &→and, lowercase) and merges encounters that share an exact encounter_date and at least one party — no fuzzy matching, no ±N-day window. The merged event unions the date fields and resolves status by asymmetric precedence."
    trajectory:
      min_searches: 2
    notes: "Genuine 2-hop with real pipeline causality: the per-note invariant (extractor.md §2/§7) + the appointment match key (resolver.md Pass 2 / §5). Each doc holds a necessary half. The iconic Q4 schedule-to-seen merge story. match:all."

  - id: a16
    type: multi_hop
    capability: decomposition
    question: "Trace the query path in the documentation-retrieval MCP server: when the local embedding service turns text into the vector used for search, what pooling and normalization does it apply to produce that vector — and once that vector reaches ChromaDB, what index type and similarity function find the nearest matches?"
    match: all
    expected_sources:
      - LOCAL_EMBEDDING_SERVICE_DOCUMENTATION.md
      - 02-Architecture-with-chromadb-local-embeddings.md
    should_abstain: false
    expected_answer: "The local embedding service runs the model forward pass, then applies MEAN POOLING over the token embeddings (the masked token states summed and divided by the attention-mask count) and finally L2 NORMALIZATION (F.normalize, p=2) to produce a unit-length 384-dimensional vector. That vector is stored in ChromaDB, which indexes it with HNSW and searches by COSINE similarity (the configured distance function is cosine). Because the vectors are L2-normalized to unit length, cosine ranking rides cleanly on the index — the normalize-then-cosine trick from the vector-DB internals, here as the MCP server's actual implementation."
    trajectory:
      min_searches: 2
    notes: "Genuine 2-hop across two MCP-server OPERATIONAL docs, each holding a necessary half: mean-pooling + L2 normalization lives only in LOCAL_EMBEDDING_SERVICE_DOCUMENTATION (§Runtime Execution); HNSW + cosine lives only in 02-Architecture (§ChromaDB Optimization + the env config). Real pipeline causality (embed → index), not a contrived staple — the connection is the literal query path. Brings the AGENT layer onto the project's PRIMARY corpus, which v2 used only as distractor mass (seed.yaml already covers these docs for OUTCOME). match:all so partial retrieval scores partial; forces ≥2 searches."

  # ═══ tool_selection — list_sources is the right move; a05/a06/a12 are now search-only (DD-031) ═══
  - id: a05
    type: factual
    capability: tool_selection
    question: "What are the major FAMILIES of chunking strategy, and for each family give one representative strategy with its one-line idea?"
    match: any
    expected_sources:
      - CHUNKING.md
    should_abstain: false
    expected_answer: "Family A size-based (A1 fixed-size: cut every N chars/tokens; A2 sliding-window/overlap: adjacent chunks share tokens). Family B structure-aware (B1 recursive splitting on a paragraph→line→sentence→word→char hierarchy; B2 format/document-aware: split on markdown/HTML/AST). Family C meaning-based (C1 semantic chunking: cut at topic shifts; C2 proposition/atomic: LLM rewrites into standalone facts). Family D decouple retrieval-unit≠generation-unit (D1 parent–child/small-to-big; D2 sentence-window). Family E context-preserving embeddings (E1 Contextual Retrieval, E2 late chunking, E3 metadata enrichment)."
    notes: "The full A–E taxonomy spans most of CHUNKING.md §4 — more than top_k=5 + the parent-expansion window can comfortably carry. This was an expand_document discriminator; that tool was dropped from the action space (DD-031), so the case is now an OUTCOME-only breadth probe: can plain search (with parent-expansion) still gather enough of the taxonomy to answer? No trajectory assertion — there is no longer a distinguishing tool to expect."

  - id: a06
    type: factual
    capability: tool_selection
    question: "Give a complete end-to-end account of two-stage retrieval (retrieve-then-rerank): the core tension it resolves, both encoder architectures and how they differ, what the reranker's score actually is, and what production systems add on top."
    match: any
    expected_sources:
      - RERANKING.md
    should_abstain: false
    expected_answer: "Tension: one model can't be both cheap enough to scan millions and accurate enough to rank the top few, so you stage it. Stage 1 bi-encoder encodes query and item SEPARATELY into vectors (precomputable/indexable, but a lossy query-blind summary); stage 2 cross-encoder concatenates the (query,item) pair and scores it JOINTLY via cross-attention (accurate, but not indexable — a fresh forward pass per pair at query time). The score is a single uncalibrated logit (higher=more relevant) from a head fine-tuned on a labeled ranking dataset like MS MARCO; it measures RELEVANCE, not correctness or faithfulness. Production adds: hosted vs self-hosted GPU serving behind a thin wrapper; other ranker families (cross-encoder pointwise, LambdaMART learning-to-rank over features, LLM listwise rerankers); latency mitigations (cap candidate_k, batch in one pass, distill/quantize, a multi-stage funnel); blended signals + click-feedback retraining via online A/B; and graceful degradation (timeout → fall back to the stage-1 order, cache hot (query,doc) pairs)."
    notes: "Demands coverage of RERANKING §1–§3 + §7 — essentially the whole doc, well past a single window. Was an expand_document discriminator; that tool was removed (DD-031), so the case is now OUTCOME-only — it tests whether search-only carries near-whole-doc breadth. No trajectory assertion (cf. a05)."

  - id: a07
    type: factual
    capability: tool_selection
    question: "The corpus covers two very different systems. Which documents belong to the workers'-comp claims-analysis pipeline, as opposed to the documentation-retrieval/RAG system?"
    match: any
    expected_sources:
      - DESIGN.md
      - extractor.md
      - resolver.md
      - normalizer.md
      - data-modeling.md
    should_abstain: false
    expected_answer: "The claims-analysis pipeline docs are: DESIGN.md, data-modeling.md, extractor.md, normalizer.md, resolver.md, claims file analysis.md, and extraction-improvement-roadmap.md (the workers'-comp claim ETL pipeline). Everything else describes the separate documentation-retrieval MCP/RAG system — its architecture variants, chunking, reranking, vector-DB internals, embeddings, and setup guides."
    trajectory:
      expects_tool: list_sources
    notes: "A question ABOUT THE SET of documents, across two domains, is naturally answered by listing the corpus (a count-of-architecture-docs phrasing would be ambiguous now that DESIGN.md adds an Architecture section). SOFT discriminator — a content search for 'claims' also surfaces these docs — so it primarily tests whether the controller CHOOSES to orient via list_sources. Retrieval recall is secondary here (the answer is a filename survey)."

  - id: a12
    type: factual
    capability: tool_selection
    question: "What are the active extractors in the v1 claims pipeline, and for each, does it use deterministic rules or an LLM — and why?"
    match: any
    expected_sources:
      - extractor.md
    should_abstain: false
    expected_answer: "ReserveChangeExtractor (RULE) — fires on Activity:'Reserving' notes and regex-captures the 'Changed to $X' line; rules because financial amounts are exact, templated, and must be 100% reproducible. AppointmentMarkerExtractor (RULE, fast-path) — catches templated headers ('Date of Appointment:', 'Next Office Visit:', etc.) without paying LLM tokens. AppointmentExtractor (LLM, general path) — fires on any note plausibly describing a medical appointment, reading narrative status (attended/missed/cancelled/scheduled) and novel scheduling formats the marker rule misses. ReturnToWorkExtractor (LLM) — judges whether a return actually occurred vs. was merely offered/discussed, which a regex can't do. The appointment type deliberately uses BOTH a rule and an LLM extractor, with the Resolver reconciling the candidates."
    notes: "The extractor catalog spans extractor.md §5 (5.1–5.4) plus the hybrid rationale in §3 — broad single-doc synthesis past a single window. Was an expand_document discriminator; that tool was removed (DD-031), so the case is now OUTCOME-only (cf. a05/a06). Deliberately asks to NAME the extractors, NOT to COUNT them: the doc is internally inconsistent on count (§5 intro says 'five' but lists four named) — a count question would have no defensible ground truth."

  # ═══ grounded_stopping — answer ABSENT; DECIDE to refuse, don't spin to budget ══════════
  - id: a08
    type: abstention
    capability: grounded_stopping
    question: "What token chunk size does the project recommend for its planned recursive-splitting (B1) chunking upgrade?"
    match: any
    expected_sources: []
    should_abstain: true
    expected_answer: "Not enough information. The docs present recursive (B1, token-based) splitting as the planned upgrade from the current 800-CHARACTER fixed-size baseline, but give no recommended token size for it — only the current 800-char setting."
    trajectory:
      max_rounds: 4
      expects_exit: finish
    notes: "Plausible-but-absent: discusses the B1 upgrade and a tempting adjacent number (800-CHAR), but no recommended TOKEN size exists in the corpus. Agent should search, see no number, and choose to abstain. max_rounds caps effort so 'grounded stopping' means refuse-without-burning-budget, not 'looped near the cap then finished'."

  - id: a09
    type: abstention
    capability: grounded_stopping
    question: "What recall@k numbers did this project's parent-child (small-to-big) chunking A/B experiment produce?"
    match: any
    expected_sources: []
    should_abstain: true
    expected_answer: "Not enough information. The corpus presents parent–child / small-to-big chunking as a planned 'next lever,' not a completed experiment — it reports no measured A/B recall numbers for it. (The only reranking-style results table in the corpus is for the cross-encoder reranker, not for parent–child chunking.)"
    trajectory:
      max_rounds: 4
      expects_exit: finish
    notes: "The parent-child A/B exists in this project's DESIGN_DECISIONS (DD-020) but NOT in the corpus, so over-corpus the correct behavior is to abstain. Distractor: RERANKING §9 shows a recall table for the RERANKER, tempting a wrong borrow. max_rounds asserts the refusal is reached without spinning to budget chasing the absent table."

  - id: a13
    type: abstention
    capability: grounded_stopping
    question: "On a claim's financial reserves, what does the NLE field stand for?"
    match: any
    expected_sources: []
    should_abstain: true
    expected_answer: "Not enough information. The claims-file inventory lists NLE as a field that appears with a value (e.g. 34.92) but explicitly marks its meaning as 'to confirm' — the documentation never defines what NLE stands for."
    trajectory:
      max_rounds: 4
      expects_exit: finish
    notes: "Plausible-but-undefined (claims domain): claims file analysis.md §10 lists 'NLE — value present (34.92) — meaning to confirm'. The abbreviation IS in the corpus but its expansion is explicitly unknown, tempting a fabricated guess (defined sibling fields AWW/CR/MMI sit nearby and bait a pattern-match). Agent should abstain. max_rounds asserts a cheap refusal rather than budget-spinning over a defined-but-not-here acronym."

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # v2 COVERAGE-GAP ADDITIONS (a18–a25). Each closes a hole the v1 set was blind on. Failing or
  # flagging at first is EXPECTED headroom (A6), not a regression. See the header notes per id.
  # ═══════════════════════════════════════════════════════════════════════════════════════════

  # ── tool_selection — was an expand_around_chunk case; tool removed (DD-031), now search-only ──
  - id: a18
    type: factual
    capability: tool_selection
    question: "In this project's reranking A/B, what recall@1, recall@3, recall@5 and MRR did hybrid+rerank reach versus hybrid alone, AND which specific false abstentions did adding the reranker eliminate, and why were those questions answerable once reranked?"
    match: any
    expected_sources:
      - RERANKING.md
    should_abstain: false
    expected_answer: "Hybrid -> hybrid+rerank: recall@1 0.724 -> 0.759; recall@3 0.793 -> 0.931; recall@5 0.897 -> 1.000; MRR 0.903 -> 0.948. Adding the cross-encoder reranker eliminated all three end-to-end false abstentions (q01, q25, q26): in each, the fact-bearing chunk WAS in the stage-1 candidate pool but ranked below top-5, so the generator saw no usable evidence and refused; the cross-encoder re-scored the pool and lifted that chunk into the top-5, so the generator could finally answer. That is the chunk-level fix document-level recall couldn't even see — the precise problem stage-2 reranking exists to solve."
    notes: "The answer needs RERANKING §9's results TABLE plus the false-abstention PARAGRAPH directly below it — a tight local neighbourhood. This was the only expand_around_chunk case; that tool was dropped from the action space (DD-031, after A/B it regressed 5 v1-solid Qs and never reliably fired), so the case is now OUTCOME-only: can search-only — with parent-expansion (window=2) supplying the ±neighbour window — still gather both the table and the paragraph? No trajectory assertion; there is no longer a distinguishing tool to expect. Outcome is fully gradable today regardless of path."

  # ── adaptive_recovery — first seeded case (capability was deferred to A3) ──────────────────
  - id: a19
    type: factual
    capability: adaptive_recovery
    question: "In the vector database's approximate-nearest-neighbour index, which single query-time knob is the dial that trades a little recall for more speed?"
    match: any
    expected_sources:
      - VECTOR_DB_INTERNALS.md
    should_abstain: false
    expected_answer: "ef_search — the HNSW query-time candidate-list size, described as the live recall<->latency dial (VECTOR_DB_INTERNALS §6). It is distinct from M and ef_construction (which are BUILD-time knobs), and distinct from the reranker's candidate_k, which is a different STAGE's latency-vs-quality knob, not the index's."
    trajectory:
      min_searches: 2
    notes: "ADAPTIVE-RECOVERY probe (first seeded case; capability was deferred to A3). The natural first query ('recall vs speed/latency dial') strongly surfaces RERANKING's candidate_k — also a latency-vs-quality dial — a genuine CROSS-DOC distractor pulling toward the wrong stage. A good path notices candidate_k belongs to the reranker, not the ANN index, and REFORMULATES toward HNSW query-time params to land ef_search. min_searches=2 is a SOFT reformulation probe: a 1-search path that still lands ef_search is fine (trajectory miss = flag). Outcome is gradable today; full tool-ERROR recovery (a failed/erroring tool fed back as a retryable observation) still waits for A3."

  # ── grounded_stopping — exit coverage: OSCILLATION (the stop-condition DD-029 just redesigned) ─
  - id: a20
    type: abstention
    capability: grounded_stopping
    question: "What ef_search value does this project benchmark its HNSW index at, and what recall@k did that specific setting achieve?"
    match: any
    expected_sources: []
    should_abstain: true
    expected_answer: "Not enough information. The corpus names ef_search as HNSW's query-time recall<->latency dial but gives NO benchmarked value for it — it even notes HNSW is overkill at the current 262-chunk scale, where brute force suffices. The only recall@k table in the corpus is for the cross-encoder RERANKER A/B (RERANKING §9), not for any ef_search/HNSW setting. So neither the ef_search value nor a recall@k for it exists to report."
    trajectory:
      max_rounds: 5
      expects_exit: oscillation
    notes: "EXIT-CONDITION coverage for the oscillation guard (the stop-condition DD-029 just redesigned, with NO eval watching it). Engineered to be pathological: the answer is absent AND lexically scattered, so reformulations ('ef_search value', 'HNSW recall numbers') keep re-finding the SAME few chunks (the VECTOR_DB knobs blurb; the RERANKING recall table as a wrong-borrow distractor) -> consecutive_redundant should reach OSCILLATION_PATIENCE and trip. This deliberately BENDS A3's 'assert the good path': for a pathological input the invariant worth asserting is that a CIRCUIT-BREAKER catches it before budget death. An even-better agent abstains via a clean finish without looping — that reads as a BENIGN trajectory miss here, never an outcome fail (outcome only needs the abstention)."

  # ── exit coverage: BUDGET exhaustion (trajectory-intent; oversized productive decomposition) ─
  - id: a21
    type: multi_hop
    capability: decomposition
    question: "Compile a complete cross-corpus catalogue of the retrieval stack's building blocks: every ANN index family the vector-DB internals doc lists, every reranker family the reranking doc distinguishes, and every chunking-strategy family the chunking doc defines — give each item a one-line trade-off."
    match: all
    expected_sources:
      - VECTOR_DB_INTERNALS.md
      - RERANKING.md
      - CHUNKING.md
    should_abstain: false
    expected_answer: "ANN index families (VECTOR_DB §6-7): Flat (exact brute force, correct baseline to ~10^5); IVF (k-means cells, search nearest few via nprobe — cheap memory, boundary misses); PQ (quantize/compress vectors to bytes — ~10-50x less memory, approximate; often IVF-PQ for billion-scale); HNSW (hierarchical small-world graph navigated coarse->fine — great recall-at-low-latency, update-tolerant, costs RAM); ScaNN/DiskANN (SIMD- or SSD-resident variants). Reranker families (RERANKING §7): cross-encoders (neural, pointwise — score each pair alone, what this project uses); Learning-to-Rank (gradient-boosted trees like LambdaMART over features — dominant in web/ecommerce); LLM rerankers (listwise — prompt an LLM to order the whole set, highest quality/cost). Chunking families (CHUNKING §4, A-E): A size-based; B structure-aware; C meaning-based; D decouple retrieval-unit != generation-unit (parent-child / sentence-window); E context-preserving embeddings (contextual retrieval, late chunking, metadata enrichment)."
    trajectory:
      min_searches: 3
      expects_exit: budget
    notes: "EXIT-CONDITION coverage for budget exhaustion. Oversized but genuinely answerable across THREE docs with many independent sub-items, so each retrieval keeps adding NEW evidence (oscillation never trips on progress) and the agent tends to keep productively gathering past max_rounds=5 -> exit_reason==budget. Same A3-bending caveat as a20: budget exhaustion is NOT the ideal path — an agent that decomposes efficiently and finishes early reads as a BENIGN trajectory miss. Outcome may land PARTIAL given the breadth (match:all scores partial coverage); that is expected, the case exists to exercise the budget exit and the operational round/token meters."

  # ── decomposition — BRIDGE (sequentially dependent) multi-hop, vs the existing parallel ones ─
  - id: a22
    type: multi_hop
    capability: decomposition
    question: "The Normalizer deliberately leaves note-BODY dates as raw text to protect one specific downstream verification check. Name that check, then identify which kind of extractor depends on it and explain what would break in that extractor if the body text were rewritten."
    match: all
    expected_sources:
      - normalizer.md
      - extractor.md
    should_abstain: false
    expected_answer: "The check is the evidence_quote substring verification: the LLM extractor must emit an evidence_quote that is a VERBATIM substring of the note body, and a post-LLM check confirms the quote actually appears in the body. The LLM extractors depend on it (the general-path AppointmentExtractor and the ReturnToWorkExtractor — the reading-comprehension extractors, not the deterministic rule extractors). If the Normalizer rewrote body text (e.g. reformatting an in-body date or a dash), the model's copied evidence_quote would no longer match the stored body, the substring check would fail, and the extraction would be rejected / lose its auditable provenance — which is exactly why the Normalizer parses the HEADER date but leaves BODY text untouched."
    trajectory:
      min_searches: 2
    notes: "BRIDGE multi-hop (sequentially DEPENDENT), the flavor the v1 set lacked: hop-2's query ('which extractor relies on THAT check') is unformulatable until hop-1 surfaces that the protected check IS the evidence_quote substring check. Contrast the PARALLEL multi-hops a03/a10/a14/a16, where each sub-fact is independently retrievable in any order. normalizer.md §3.2/§7 names why body dates stay raw (evidence_quote fidelity); extractor.md ties that fidelity to the LLM extractors. match:all so retrieving only one side scores partial."

  # ── grounded_stopping — PARTIAL answerability (answer the known parts, abstain on the unknown) ─
  - id: a23
    type: factual
    capability: grounded_stopping
    question: "In the claims file's financial-reserves section, what do each of AWW, CR, and NLE stand for?"
    match: all
    expected_sources:
      - claims file analysis.md
    should_abstain: false
    expected_answer: "AWW stands for average weekly wage and CR for compensation rate (both defined in claims file analysis.md §10, with example values). NLE is NOT defined in the corpus: it appears as a present value (e.g. 34.92) explicitly marked 'meaning to confirm', so its expansion is unknown and must not be guessed. A correct answer defines AWW and CR and abstains SPECIFICALLY on NLE — partial answer, not blanket refusal and not a fabricated NLE expansion."
    notes: "PARTIAL answerability / selective honesty — the hardest abstention shape and absent from v1 (where abstention was all-or-nothing). Two failure modes it catches: (1) fabricating an NLE expansion to look complete; (2) OVER-abstaining on the whole question because one part is unknown. should_abstain is FALSE because the question is mostly answerable, so the case ALSO stress-tests is_abstention: a good partial answer ('AWW=..., CR=..., but NLE is undefined in the docs') must NOT be miscounted as a false abstention. (NB: TTD/TPD/PPD are only LISTED as benefit-type abbreviations in §10, never expanded — corrected the a13 note accordingly — so AWW/CR are the right defined anchors here.)"

  # ── decomposition — CONFLICTING evidence across two architecture docs ──────────────────────
  - id: a24
    type: multi_hop
    capability: decomposition
    question: "What vector store and embedding model does the documentation-retrieval MCP server use, and how many search tools does it expose?"
    match: all
    expected_sources:
      - 01-Architecture-with-azure-cognitive-search.md
      - 02-Architecture-with-chromadb-local-embeddings.md
    should_abstain: false
    expected_answer: "The corpus documents TWO architecture variants of the same MCP server and they DISAGREE. The Azure variant (01-Architecture) uses Azure Cognitive Search with Azure OpenAI text-embedding-ada-002 (1536-dimensional) and exposes 4 search tools. The local variant (02-Architecture) uses ChromaDB with local Sentence-Transformers all-MiniLM-L6-v2 (384-dimensional) and exposes 5 search tools. 02 states the system underwent a 'complete migration from Azure to ChromaDB', so the ChromaDB/local stack is the CURRENT/primary one and the Azure stack is its superseded predecessor. A correct answer surfaces BOTH and the migration relationship rather than silently reporting just one."
    trajectory:
      min_searches: 2
    notes: "CONFLICTING-EVIDENCE probe (absent from v1). Two corpus docs answer the same question differently (Azure/ada-002/1536-dim/4-tools vs ChromaDB/MiniLM/384-dim/5-tools). The failure mode is silently picking whichever variant ranks first and presenting it as THE answer; the right behavior is to recognise the conflict and RESOLVE it via the migration note (02 supersedes 01). Reuses docs a07/a16 touch, but the novel axis is conflict-surfacing, not retrieval recall. match:all so reporting only one variant scores partial."

  # ── tool_selection — list_sources (second case; corpus-shape question) ─────────────────────
  - id: a25
    type: factual
    capability: tool_selection
    question: "Treating the corpus as a whole, which of its documents are step-by-step SETUP or operational how-to guides, as opposed to conceptual technique explainers or architecture overviews?"
    match: any
    expected_sources:
      - MCP_SERVER_SETUP.md
      - DOCUMENT_UPLOAD_SETUP_FOR_CHROMADB.md
      - CHROMADB_DATA_VIEWING_GUIDE.md
      - AZURE_EMBEDDING_MIGRATION_GUIDE.md
    should_abstain: false
    expected_answer: "The setup / operational how-to guides are the documents whose role is procedural: MCP_SERVER_SETUP.md, DOCUMENT_UPLOAD_SETUP_FOR_CHROMADB.md, CHROMADB_DATA_VIEWING_GUIDE.md, AZURE_EMBEDDING_MIGRATION_GUIDE.md. These contrast with the conceptual technique explainers (CHUNKING.md, RERANKING.md, VECTOR_DB_INTERNALS.md, LOCAL_EMBEDDING_SERVICE_DOCUMENTATION.md, and the analysis/rationale docs DOCUMENT_UPLOAD_ANALYSIS.md and EXTRACTING_FILE_METADATA.md, which explain rather than instruct) and the architecture overviews (01-/02-Architecture), and with the separate claims-pipeline ETL set."
    trajectory:
      expects_tool: list_sources
    notes: "Second list_sources case (a07 was the only one, and a07's note flags it as a soft discriminator). A question ABOUT THE SET of documents — sorting the corpus by document ROLE — is naturally answered by SEEING the corpus via list_sources, then classifying by filename/role, rather than by content search. SOFT discriminator (like a07): a content search for 'setup' also surfaces these, so the primary test is whether the controller CHOOSES to orient via list_sources; retrieval recall is secondary (the answer is a filename survey, classification is filename-driven). match:any keeps grading lenient on the exact partition."

  # ── adaptive_recovery — SECOND case (the taxonomy's thinnest row had only a19) ─────────────
  - id: a26
    type: factual
    capability: adaptive_recovery
    question: "When the system returns its top-5 chunks for a query, what does the numeric relevance score attached to each returned chunk actually represent, and is it a calibrated probability you can threshold as a confidence?"
    match: any
    expected_sources:
      - RERANKING.md
    should_abstain: false
    expected_answer: "The score on each returned chunk is the STAGE-2 cross-encoder RERANKER's output — the final top-5 ordering is produced by the reranker, not by the stage-1 vector search. It is a single raw scalar LOGIT from a one-output linear head (num_labels=1): higher = more relevant. It is NOT a calibrated probability — it is unbounded and often negative, so you cannot threshold it as a confidence; ranking uses only the RELATIVE order (a negative top score can still be rank 1). The number encodes a learned, supervised notion of RELEVANCE (the head was fine-tuned on a labeled ranking set like MS MARCO), not correctness or faithfulness. It must NOT be confused with the stage-1 bi-encoder COSINE score (stored as cosine distance = 1 − cosine similarity, range 0–2) — that is a different number from an earlier stage."
    trajectory:
      min_searches: 2
    notes: "ADAPTIVE-RECOVERY probe #2 (the row had only a19; a single soft case can't discriminate the capability — AGENT_EVAL_SETS.md A1/A6). The recovery trigger is STAGE confusion, distinct from a19's KNOB confusion: the natural first phrasing ('the similarity score on the results') strongly surfaces the stage-1 cosine 1−distance / 0–2 range (VECTOR_DB_INTERNALS §4) — a strong CROSS-DOC distractor pulling toward the wrong stage. A good path notices the FINAL returned ordering comes from stage-2 reranking and reformulates toward the cross-encoder score (RERANKING §3). min_searches=2 is a SOFT reformulation probe like a19: a 1-search path that still lands the reranker-logit answer is fine (trajectory miss = flag, not auto-fail). The OUTCOME is the real test — did the agent ground the cross-encoder LOGIT (uncalibrated, not thresholdable) and NOT borrow the stage-1 cosine 0–2 score? Reuses RERANKING §3's content that a06 also touches, but a06 NAMES reranking and grades expand_document; here reranking is UNSTATED, which is what forces the recovery. Outcome fully gradable today; full tool-ERROR recovery still waits for A3."
