[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.0.1"
description = "A from-scratch, learning-focused agentic RAG research assistant"
requires-python = ">=3.10"

# Dependencies live HERE (single source of truth) — no separate requirements.txt.
# We add a dependency only when a module actually needs it, so this list stays an
# honest record of what the project really uses.
dependencies = [
    "pyyaml>=6.0",                  # read the versioned YAML config + eval datasets
    "sentence-transformers>=2.2",   # local embeddings (all-MiniLM-L6-v2); pulls torch
    "chromadb>=0.5",                # persistent vector store for the naive baseline
    "rank-bm25>=0.2",               # BM25 sparse retrieval for hybrid search
    "groq>=0.11",                   # LLM provider (judge) — Groq's gpt-oss as the cross-family judge
    "google-genai>=1.0",            # LLM provider (generator) — Gemini via the unified SDK
    "python-dotenv>=1.0",           # load GOOGLE_API_KEY / GROQ_API_KEY from a gitignored .env
    "pydantic>=2.0",                # typed tool-arg schemas for the agent's tool registry (A1)
    "langgraph>=1.0",               # the agent loop's LangGraph twin (capstone; agent/graph.py)
    # --- deploy: the pgvector store + the demo backend (server/) ---
    "psycopg[binary,pool]>=3.2",    # Postgres client + connection pool for the pgvector store
    "pgvector>=0.3",                # pgvector type adapters (Vector binding, cosine <=> search)
    "fastapi>=0.115",               # demo backend HTTP API (server/app.py)
    "uvicorn[standard]>=0.30",      # ASGI server for the FastAPI app
    "sse-starlette>=2.1",           # Server-Sent Events streaming of the agent trajectory
    "python-multipart>=0.0.9",      # FastAPI file uploads (POST /upload, bring-your-own-doc)
    "pypdf>=4.0",                   # extract text from uploaded PDFs (bring-your-own-doc)
]

[tool.setuptools.packages.find]
where = ["src"]
