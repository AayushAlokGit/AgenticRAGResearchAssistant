[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.0.1"
description = "A from-scratch, learning-focused agentic RAG research assistant"
requires-python = ">=3.10"

# Dependencies live HERE (single source of truth) — no separate requirements.txt.
# We add a dependency only when a module actually needs it, so this list stays an
# honest record of what the project really uses.
dependencies = [
    "pyyaml>=6.0",                  # read the versioned YAML config + eval datasets
    "sentence-transformers>=2.2",   # local embeddings (all-MiniLM-L6-v2); pulls torch
    "chromadb>=0.5",                # persistent vector store for the naive baseline
    "rank-bm25>=0.2",               # BM25 sparse retrieval for hybrid search
    "groq>=0.11",                   # LLM provider (agent/judge) — Groq-only for now (DD-004)
    "python-dotenv>=1.0",           # load GROQ_API_KEY etc. from a gitignored .env
]

[tool.setuptools.packages.find]
where = ["src"]
